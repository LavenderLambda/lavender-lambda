import pandas as pd
import yfinance as yf
from datetime import datetime
import os
import sys
from supabase import create_client

def run_sync():
    try:
        # 1. Setup Connection
        url = os.environ.get("SUPABASE_URL")
        key = os.environ.get("SUPABASE_KEY")
        
        if not url or not key:
            print("ERROR: Secrets not found. Check GitHub Settings.")
            sys.exit(1)

        supabase = create_client(url, key)

        # 2. Watchlist
        tickers = ["BTC-AUD", "ETH-AUD", "NVDA", "SPY", "VAS.AX", "GC=F", "SI=F", "AUDUSD=X", "^TNX"]

        # 3. Fetch Data
        print(f"Robot waking up at {datetime.now()}...")
        df = yf.download(tickers, period="5d", interval="1d", progress=False)['Close'].ffill()
        
        if df.empty:
            print("ERROR: Market data download failed.")
            return

        # 4. Save Performance Log
        today = datetime.now().strftime('%Y-%m-%d')
        daily_vol = df.pct_change().iloc[-1].abs().mean() * 100
        
        print(f"Logging volatility for {today}: {daily_vol:.2f}%")
        
        # Use upsert to handle existing dates
        supabase.table("performance_logs").upsert({
            "date": today, 
            "error_rate": round(daily_vol, 2)
        }).execute()

        print("Sync complete. Robot going back to sleep.")

    except Exception as e:
        print(f"CRITICAL ERROR: {str(e)}")
        sys.exit(1)

if __name__ == "__main__":
    run_sync()
