name: Daily Lavender Heartbeat

on:
  schedule:
    # Runs at 10:00 AM Sydney time
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Upgraded to 3.11 for better library support

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # FORCE NumPy 1.x to avoid the 'dtype size' crash
          pip install "numpy<2.0.0" 
          pip install pandas yfinance supabase postgrest==0.10.6

      - name: Run Heartbeat
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python heartbeat.py
