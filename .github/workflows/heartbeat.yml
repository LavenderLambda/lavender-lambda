name: Daily Lavender Heartbeat

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # We are pinning EVERYTHING to known stable versions to stop the 'ValueError'
          pip install "numpy<2.0.0" "pandas<2.1.0" "yfinance==0.2.40" "supabase==2.4.0" "postgrest==0.10.6" "httpx<0.28.0"

      - name: Run Heartbeat
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python heartbeat.py
