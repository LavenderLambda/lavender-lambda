name: Daily Lavender Heartbeat

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install Tools
        run: |
          python -m pip install --upgrade pip
          # We only lock the big tools; let them pick their own sub-parts
          pip install "numpy<2.0.0" "pandas<2.1.0" "yfinance==0.2.40" "supabase==2.4.0"

      - name: 4. Run Heartbeat
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python heartbeat.py
